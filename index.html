<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gašper Uršič — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14150f;
    --paper: #eeece3;
    --accent: #3d6b55;
    --accent-soft: #cdd8cf;
    --muted: #6f7268;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Work Sans', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 1rem;
    padding: 2rem clamp(1.25rem, 4vw, 3rem) 1.5rem;
    border-bottom: 1px solid rgba(238,236,227,0.12);
  }

  .identity .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin: 0 0 0.4rem;
  }

  .identity h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  /* Signature element: language switch styled as two paper tabs */
  .lang-switch {
    display: flex;
    gap: 0.4rem;
    background: rgba(238,236,227,0.06);
    padding: 0.35rem;
    border-radius: 999px;
  }

  .lang-switch button {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 0.55rem 1.3rem;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--paper);
    opacity: 0.55;
    cursor: pointer;
    transition: background 0.25s ease, opacity 0.25s ease, color 0.25s ease;
  }

  .lang-switch button:hover { opacity: 0.85; }

  .lang-switch button.active {
    background: var(--paper);
    color: var(--ink);
    opacity: 1;
  }

  .lang-switch button:focus-visible {
    outline: 2px solid var(--accent-soft);
    outline-offset: 2px;
  }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: clamp(1rem, 3vw, 2.5rem);
  }

  .sheet {
    width: 100%;
    max-width: 900px;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .sheet iframe {
    width: 100%;
    height: 82vh;
    min-height: 480px;
    border: none;
    display: block;
  }

  .fallback {
    text-align: center;
    padding: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid rgba(20,21,15,0.08);
  }

  .fallback a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
  }

  footer {
    text-align: center;
    padding: 1.25rem;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="identity">
    <p class="eyebrow">Portfolio</p>
    <h1>Gašper Uršič</h1>
  </div>
  <div class="lang-switch" role="group" aria-label="Izbira jezika portfolia">
    <button id="btn-si" onclick="setLang('si')">Slovensko</button>
    <button id="btn-en" onclick="setLang('en')">English</button>
  </div>
</header>

<main>
  <div class="sheet">
    <iframe id="pdf-frame" src="Portfolijo.si.pdf#toolbar=0" title="Portfolio PDF"></iframe>
    <div class="fallback">
      Se ne prikaže pravilno? <a id="download-link" href="Portfolijo.si.pdf" download>Prenesi PDF</a>
    </div>
  </div>
</main>

<footer>© 2026 Gašper Uršič</footer>

<script>
  const files = {
    si: "Portfolijo.si.pdf",
    en: "Portfolijo.en.pdf"
  };

  function setLang(lang) {
    document.getElementById('pdf-frame').src = files[lang] + "#toolbar=0";
    document.getElementById('download-link').href = files[lang];
    document.getElementById('btn-si').classList.toggle('active', lang === 'si');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;
  }

  setLang('si');
</script>

</body>
</html>
