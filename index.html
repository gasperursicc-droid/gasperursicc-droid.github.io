<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gašper Uršič — Portfolio</title>

<style>
  :root {
    --ink: #14150f;
    --paper: #eeece3;
    --accent: #3d6b55;
    --accent-soft: #cdd8cf;
    --muted: #6f7268;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Work Sans', sans-serif;
  }

  /* NASLOVNICA - replika platnice portfolia */
  .cover {
    background: #ffffff;
    color: var(--ink);
  }

  .cover-text {
    padding: clamp(1.5rem, 5vw, 3rem) clamp(1.25rem, 6vw, 4rem) 1rem;
  }

  .cover-name {
    font-family: 'Work Sans', sans-serif;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    font-weight: 500;
    margin: 0 0 0.4rem;
  }

  .cover-title {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(2.6rem, 11vw, 6rem);
    line-height: 0.95;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .cover-subtitle {
    font-family: 'Work Sans', sans-serif;
    font-size: clamp(1rem, 3vw, 1.6rem);
    font-weight: 500;
    text-align: right;
    margin: 0.5rem 0 0;
  }

  .cover-photo {
    width: 100%;
    display: block;
  }

  .cover-photo img {
    width: 100%;
    height: auto;
    display: block;
  }

  .lang-bar {
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem;
  }
