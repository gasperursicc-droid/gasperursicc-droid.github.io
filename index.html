<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gašper Uršič — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14150f;
    --paper: #eeece3;
    --accent: #3d6b55;
    --accent-soft: #cdd8cf;
    --muted: #6f7268;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Work Sans', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    padding: 1.5rem clamp(1rem, 4vw, 3rem);
    border-bottom: 1px solid rgba(238,236,227,0.12);
  }

  .identity .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin: 0 0 0.35rem;
  }

  .identity h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.4rem, 5vw, 2.4rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .lang-switch {
    display: flex;
    gap: 0.35rem;
    background: rgba(238,236,227,0.06);
    padding: 0.3rem;
    border-radius: 999px;
    width: 100%;
    max-width: 260px;
  }

  .lang-switch button {
    flex: 1;
    font-family: 'Work Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 0.65rem 0.8rem;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--paper);
    opacity: 0.55;
    cursor: pointer;
    transition: background 0.25s ease, opacity 0.25s ease, color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .lang-switch button:hover { opacity: 0.85; }

  .lang-switch button.active {
    background: var(--paper);
    color: var(--ink);
    opacity: 1;
  }

  .lang-switch button:focus-visible {
    outline: 2px solid var(--accent-soft);
    outline-offset: 2px;
  }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: clamp(0.75rem, 3vw, 2.5rem);
  }

  .sheet {
    width: 100%;
    max-width: 900px;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .sheet iframe {
    width: 100%;
    height: 82vh;
    min-height: 420px;
    border: none;
    display: block;
  }

  .fallback {
    text-align: center;
    padding: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid rgba(20,21,15,0.08);
  }

  .fallback a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
  }

  footer {
    text-align: center;
    padding: 1.25rem;
    font-size: 0.75rem;
    color: var(--muted);
  }

  /* Mobile prilagoditve */
  @media (max-width: 640px) {
    header {
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      padding: 1.25rem 1rem;
    }

    .identity {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lang-switch {
      max-width: 100%;
      margin: 0 auto;
    }

    .lang-switch button {
      padding: 0.75rem 0.6rem;
      font-size: 0.9rem;
    }

    main {
      padding: 0.6rem;
    }

    .sheet {
      border-radius: 4px;
    }

    .sheet iframe {
      height: 70vh;
      min-height: 340px;
    }

    .fallback {
      font-size: 0.8rem;
      padding: 0.9rem;
    }
  }

  /* iOS Safari ne prikaže PDF v iframe zanesljivo - poudarimo gumb za prenos */
  @supports (-webkit-touch-callout: none) {
    .fallback {
      font-size: 0.95rem;
      font-weight: 500;
      padding: 1.1rem;
    }
  }
</style>
</head>
<body>

<header>
  <div class="identity">
    <p class="eyebrow">Portfolio</p>
    <h1>Gašper Uršič</h1>
  </div>
  <div class="lang-switch" role="group" aria-label="Izbira jezika portfolia">
    <button id="btn-si" onclick="setLang('si')">Slovensko</button>
    <button id="btn-en" onclick="setLang('en')">English</button>
  </div>
</header>

<main>
  <div class="sheet">
    <iframe id="pdf-frame" src="Portfolijo.si.pdf#toolbar=0" title="Portfolio PDF"></iframe>
    <div class="fallback">
      Se ne prikaže pravilno? <a id="download-link" href="Portfolijo.si.pdf" download>Prenesi PDF</a>
    </div>
  </div>
</main>

<footer>© 2026 Gašper Uršič</footer>

<script>
  const files = {
    si: "Portfolijo.si.pdf",
    en: "Portfolijo.en.pdf"
  };

  function setLang(lang) {
    document.getElementById('pdf-frame').src = files[lang] + "#toolbar=0";
    document.getElementById('download-link').href = files[lang];
    document.getElementById('btn-si').classList.toggle('active', lang === 'si');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;
  }

  setLang('si');
</script>

</body>
</html>
